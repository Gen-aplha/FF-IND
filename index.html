<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FF IND</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#splash{position:fixed;inset:0;display:grid;place-items:center;background:#000;animation:fadeout .35s ease 1.65s forwards}
#splash img{display:block;width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain}
@keyframes fadeout{to{opacity:0;visibility:hidden}}
</style>
</head>
<body>
<div id="splash"><img src="./ff-ind-logo.jpg" alt="FF IND logo"></div>
<script>setTimeout(()=>{document.getElementById('splash').remove()},2000)</script>
</body>
</html>
